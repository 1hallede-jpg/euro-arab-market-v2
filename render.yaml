services:
  - type: web
    name: euro-arab-market
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run build:server && rm -rf public && cp -r dist public && cp dist/search-static.html public/search.html && cp boot.cjs boot.js
    startCommand: node --eval "require('./boot.cjs')"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CACHE_BUST
        value: "2026-07-08-v5-final"
